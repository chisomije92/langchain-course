[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chisomije", email = "chisomije92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.10.1",
    "certifi>=2026.10.23",
    "firecrawl-py>=4.54.0",
    "isort>=9.0.2",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "nltk>=3.10.4",
    "openai>=3.41.0",
    "pillow>=13.0.0",
    "pinecone>=6,<8",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "streamlit-chat>=0.1.1",
    "unstructured>=0.27.35",
    "uvicorn>=0.54.0",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
